name: CI

on:
  pull_request:
  push:
    branches: [main]

# Una corrida por rama: un push nuevo al mismo PR cancela la corrida vieja. En `main` no se
# cancelan: un deploy de Pages en curso debe terminar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos a nivel workflow; solo el job de deploy agrega los de Pages (solo lectura).
permissions:
  contents: read

env:
  # El service de abajo crea esta base: no hace falta el init script del compose local.
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agrobot_test
  ENVIRONMENT: test

jobs:
  test:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrobot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar uv (con cache)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Instalar dependencias (Python según .python-version)
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: Contrato OpenAPI
        run: uv run pytest tests/test_openapi_contract.py

      - name: Tests con cobertura
        run: >-
          uv run pytest
          --cov=app
          --cov-report=term
          --cov-report=xml
          --cov-report=html

      - name: Subir el reporte HTML de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: docker build (sin push)
        run: docker build --tag agrobot-alerts:ci .

  pages-build:
    name: Armar el sitio de GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bajar el HTML de cobertura del job de tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-html
          path: _site/coverage

      - name: Armar _site (Swagger UI + OpenAPI + cobertura)
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp docs/openapi.json _site/openapi.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  pages-deploy:
    name: Deploy a GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Sin cancelar: un deploy en curso nunca se interrumpe.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
